spring:
  application:
    name: sabores-del-himalaya

  datasource:
    url: jdbc:postgresql://localhost:5432/himalaya_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
