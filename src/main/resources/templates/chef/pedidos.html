<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pedidos - Chef | Sabor del Himalaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex flex-col">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full space-y-8">

        <!-- Header -->
        <div class="flex items-center justify-between border-b border-stone-200 pb-4">
            <h1 class="text-3xl font-extrabold text-stone-900">📦 Gestión de Pedidos</h1>
            <a href="/chef" class="text-sm font-medium text-amber-800 hover:text-amber-600 flex items-center space-x-1">
                <span>←</span><span>Panel Chef</span>
            </a>
        </div>

        <!-- Alertas flash -->
        <div th:if="${successMsg}"
             class="bg-green-50 border border-green-300 text-green-800 text-sm px-5 py-3 rounded-xl font-medium">
            ✅ <span th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}"
             class="bg-red-50 border border-red-300 text-red-700 text-sm px-5 py-3 rounded-xl font-medium">
            ⚠️ <span th:text="${errorMsg}"></span>
        </div>

        <!-- Pedidos del día actual -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold text-amber-900 flex items-center space-x-2">
                    <span>📅 Pedidos de hoy</span>
                    <span class="text-sm font-semibold text-stone-500"
                          th:text="'(' + ${#temporals.format(todayDate, 'dd/MM/yyyy')} + ')'">(25/11/2026)</span>
                </h2>
                <span class="text-xs font-semibold bg-amber-100 text-amber-900 px-3 py-1 rounded-full"
                      th:text="${#lists.size(todayOrders)} + ' pedidos'">0 pedidos</span>
            </div>

            <div th:if="${#lists.isEmpty(todayOrders)}"
                 class="bg-white rounded-2xl shadow-sm border border-stone-200 p-10 text-center space-y-2">
                <p class="text-4xl">🍽️</p>
                <p class="text-base font-semibold text-stone-700">No hay pedidos registrados para el día de hoy</p>
            </div>

            <div th:unless="${#lists.isEmpty(todayOrders)}"
                 class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <th:block th:each="order : ${todayOrders}">
                    <div th:replace="~{fragments/order-card :: orderCard(${order})}"></div>
                </th:block>
            </div>
        </section>

        <!-- Botón y sección colapsable de pedidos anteriores divididos por fecha -->
        <section th:if="${!#maps.isEmpty(pastOrdersByDate)}" class="space-y-6 pt-4 border-t border-stone-200">
            <div class="flex justify-center">
                <button id="toggle-past-orders-btn" type="button" onclick="togglePastOrders()"
                        class="px-6 py-2.5 rounded-xl border border-amber-800 text-amber-800 hover:bg-amber-100 text-sm font-semibold transition shadow-sm">
                    📜 Mostrar pedidos anteriores
                </button>
            </div>

            <div id="past-orders-section" class="hidden space-y-8">
                <div th:each="entry : ${pastOrdersByDate}" class="space-y-4">
                    <div class="flex items-center justify-between border-b border-stone-200 pb-2">
                        <h3 class="text-lg font-bold text-stone-800"
                            th:text="'📅 ' + ${#temporals.format(entry.key, 'dd/MM/yyyy')}">📅 24/11/2026</h3>
                        <span class="text-xs font-semibold bg-stone-200 text-stone-700 px-3 py-1 rounded-full"
                              th:text="${#lists.size(entry.value)} + ' pedidos'">0 pedidos</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                        <th:block th:each="order : ${entry.value}">
                            <div th:replace="~{fragments/order-card :: orderCard(${order})}"></div>
                        </th:block>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-stone-100 border-t border-stone-200 py-6 text-center text-xs text-stone-500 mt-10">
        © 2026 Sabor del Himalaya - Auténtica Cocina Nepalí a Domicilio.
    </footer>

    <script>
        function togglePastOrders() {
            const section = document.getElementById('past-orders-section');
            const btn = document.getElementById('toggle-past-orders-btn');
            const isHidden = section.classList.contains('hidden');
            if (isHidden) {
                section.classList.remove('hidden');
                btn.textContent = '🔼 Ocultar pedidos anteriores';
            } else {
                section.classList.add('hidden');
                btn.textContent = '📜 Mostrar pedidos anteriores';
            }
        }
    </script>
</body>
</html>
