<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pedidos - Chef | Sabor del Himalaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full space-y-8">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-stone-200 pb-4">
        <h1 class="text-3xl font-extrabold text-stone-900">📦 Gestión de Pedidos</h1>
        <a href="/chef" class="text-sm font-medium text-amber-800 hover:text-amber-600 flex items-center space-x-1">
            <span>←</span><span>Panel Chef</span>
        </a>
    </div>
    <!-- Alertas flash -->
    <div th:if="${successMsg}"
         class="bg-green-50 border border-green-300 text-green-800 text-sm px-5 py-3 rounded-xl font-medium">
        ✅ <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}"
         class="bg-red-50 border border-red-300 text-red-700 text-sm px-5 py-3 rounded-xl font-medium">
        ⚠️ <span th:text="${errorMsg}"></span>
    </div>
    <!-- Sin pedidos -->
    <div th:if="${#lists.isEmpty(orders)}"
         class="bg-white rounded-2xl shadow-sm border border-stone-200 p-12 text-center space-y-3">
        <p class="text-5xl">🍽️</p>
        <p class="text-lg font-semibold text-stone-700">No hay pedidos registrados</p>
    </div>
    <!-- Grid de cards de pedidos -->
    <div th:unless="${#lists.isEmpty(orders)}"
         class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <div th:each="order : ${orders}"
             class="bg-white rounded-2xl shadow-sm border border-stone-200 flex flex-col overflow-hidden hover:shadow-md transition">
            <!-- Cabecera de la card -->
            <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between"
                 th:classappend="${order.status.name() == 'RECIBIDO'} ? 'bg-blue-50' :
                                     (${order.status.name() == 'EN_PREPARACION'} ? 'bg-amber-50' :
                                     (${order.status.name() == 'ENTREGADO'} ? 'bg-green-50' : 'bg-red-50'))">
                <div>
                    <p class="text-xs text-stone-500 uppercase font-semibold tracking-wide">Pedido</p>
                    <p class="font-mono font-bold text-stone-900 text-sm" th:text="${order.orderNumber}">PED-...</p>
                </div>
                <!-- Badge de estado -->
                <span class="text-xs font-bold px-3 py-1 rounded-full"
                      th:classappend="${order.status.name() == 'RECIBIDO'}      ? 'bg-blue-100 text-blue-800' :
                                          (${order.status.name() == 'EN_PREPARACION'} ? 'bg-amber-200 text-amber-900' :
                                          (${order.status.name() == 'ENTREGADO'}     ? 'bg-green-100 text-green-800' :
                                                                                        'bg-red-100 text-red-700'))"
                      th:text="${order.status}">RECIBIDO</span>
            </div>
            <!-- Cuerpo -->
            <div class="p-5 flex-grow space-y-3">
                <!-- Cliente y fecha -->
                <div class="flex items-center justify-between text-xs text-stone-500">
                    <span th:text="${order.user.name}">Cliente</span>
                    <span th:text="${#temporals.format(order.createdAt, 'dd/MM HH:mm')}">01/01 12:00</span>
                </div>
                <!-- Artículos -->
                <ul class="text-sm text-stone-700 space-y-1 border-t border-stone-100 pt-2">
                    <li th:each="item : ${order.items}" class="flex justify-between">
                            <span>
                                <span th:text="${item.quantity}">1</span>×
                                <span th:if="${item.product != null}" th:text="${item.product.name}">Producto</span>
                                <span th:if="${item.product == null}" class="italic text-stone-500">Menú diario</span>
                            </span>
                        <span class="font-semibold" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)} + ' €'">0.00 €</span>
                    </li>
                </ul>
                <!-- Entrega -->
                <div class="border-t border-stone-100 pt-2 text-xs text-stone-600 space-y-1">
                    <p>📍 <span th:text="${order.deliveryAddress}">Dirección</span></p>
                    <p>📞 <span th:text="${order.phone}">Teléfono</span></p>
                    <p th:if="${order.notes != null and !#strings.isEmpty(order.notes)}">
                        📝 <span th:text="${order.notes}"></span>
                    </p>
                </div>
                <!-- Total -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-stone-500 font-semibold uppercase">Total</span>
                    <span class="text-lg font-extrabold text-amber-900"
                          th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)} + ' €'">0.00 €</span>
                </div>
            </div>

            <!-- Pie: cambiar estado -->
            <div class="px-5 py-4 border-t border-stone-100 bg-stone-50">
                <form th:action="@{'/chef/pedidos/' + ${order.id} + '/estado'}" method="post"
                      class="flex items-center space-x-2">
                    <select name="status"
                            class="flex-grow border border-stone-300 rounded-lg px-2 py-1.5 text-xs focus:ring-amber-500 focus:border-amber-500">
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${s == order.status}">Estado</option>
                    </select>
                    <button type="submit"
                            class="px-3 py-1.5 rounded-lg bg-amber-800 hover:bg-amber-700 text-white text-xs font-bold transition whitespace-nowrap">
                        Actualizar
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
<footer class="bg-stone-100 border-t border-stone-200 py-6 text-center text-xs text-stone-500">
    © 2026 Sabor del Himalaya - Auténtica Cocina Nepalí a Domicilio.
</footer>
</body>
</html>
