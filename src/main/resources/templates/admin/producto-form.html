<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Sabor del Himalaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="flex-grow max-w-2xl mx-auto px-4 py-10 w-full">
    <div class="bg-white rounded-2xl shadow-md border border-stone-200 p-8">
        <div class="pb-4 border-b border-stone-200 mb-6">
            <a th:href="@{/admin/carta}" class="text-xs text-amber-800 font-semibold hover:underline">
                ← Volver al Catálogo de Carta
            </a>
            <h1 class="text-2xl font-extrabold text-stone-900 mt-2">Editar Plato / Bebida</h1>
            <p class="text-xs text-stone-500 mt-1">Modifique los campos necesarios y guarde los cambios</p>
        </div>
        <form th:action="@{'/admin/carta/editar/' + ${productDto.id}}" th:object="${productDto}" method="post" class="space-y-5">
            <input type="hidden" th:field="*{id}" />
            <!-- Nombre -->
            <div>
                <label for="name" class="block text-xs font-semibold text-stone-700 uppercase tracking-wide">Nombre del Producto</label>
                <input type="text" id="name" th:field="*{name}"
                       class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required />
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
            </div>
            <!-- Categoría -->
            <div>
                <label for="categoryId" class="block text-xs font-semibold text-stone-700 uppercase tracking-wide">Categoría</label>
                <select id="categoryId" th:field="*{categoryId}"
                        class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == productDto.categoryId}">
                        Entrantes
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="mt-1 text-xs text-red-600"></p>
            </div>
            <!-- Descripción detallada de ingredientes -->
            <div>
                <label for="description" class="block text-xs font-semibold text-stone-700 uppercase tracking-wide">Descripción e Ingredientes</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-amber-600 focus:ring-1 focus:ring-amber-600"></textarea>
                <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-xs text-red-600"></p>
            </div>
            <!-- Precio y Estado -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="price" class="block text-xs font-semibold text-stone-700 uppercase tracking-wide">Precio (€)</label>
                    <input type="number" step="0.01" min="0.01" id="price" th:field="*{price}"
                           class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-amber-600 focus:ring-1 focus:ring-amber-600" required />
                    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="mt-1 text-xs text-red-600"></p>
                </div>
                <div>
                    <label for="status" class="block text-xs font-semibold text-stone-700 uppercase tracking-wide">Estado</label>
                    <select id="status" th:field="*{status}"
                            class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-amber-600 focus:ring-1 focus:ring-amber-600">
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.name()}" th:selected="${st == productDto.status}">
                            ACTIVO
                        </option>
                    </select>
                </div>
            </div>
            <!-- Botones -->
            <div class="pt-6 flex justify-end space-x-3 border-t border-stone-100">
                <a th:href="@{/admin/carta}"
                   class="px-4 py-2 rounded-md border border-stone-300 text-stone-700 text-sm font-medium hover:bg-stone-50 transition">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-5 py-2 rounded-md bg-amber-800 hover:bg-amber-700 text-white text-sm font-bold shadow-sm transition">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</main>
<footer class="bg-stone-100 border-t border-stone-200 py-4 text-center text-xs text-stone-500">
    © 2026 Sabor del Himalaya - Módulo de Administración de Carta
</footer>
</body>
</html>
