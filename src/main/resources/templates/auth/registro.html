<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Sabor del Himalaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex flex-col">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md border border-stone-200">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-amber-900">Crear Cuenta de Cliente</h1>
                <p class="text-sm text-stone-600 mt-1">Regístrese para realizar pedidos a domicilio en Sabor del Himalaya</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="mb-4 p-4 rounded-md bg-red-50 border border-red-200 text-red-700 text-sm">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/registro}" th:object="${registerDto}" method="post" class="space-y-4">
                <!-- Nombre completo -->
                <div>
                    <label for="name" class="block text-sm font-medium text-stone-700">Nombre completo</label>
                    <input type="text" id="name" th:field="*{name}"
                           class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 shadow-sm focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600 text-sm"
                           placeholder="Ej. Ana Sharma" required>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
                </div>

                <!-- Correo electrónico (login) -->
                <div>
                    <label for="email" class="block text-sm font-medium text-stone-700">Correo electrónico (login)</label>
                    <input type="email" id="email" th:field="*{email}"
                           class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 shadow-sm focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600 text-sm"
                           placeholder="ana@ejemplo.com" required>
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-red-600"></p>
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-stone-700">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}"
                           class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 shadow-sm focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600 text-sm"
                           placeholder="Mínimo 6 caracteres" required>
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-600"></p>
                </div>

                <!-- Dirección de entrega -->
                <div>
                    <label for="address" class="block text-sm font-medium text-stone-700">Dirección de entrega</label>
                    <input type="text" id="address" th:field="*{address}"
                           class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 shadow-sm focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600 text-sm"
                           placeholder="Calle, número, piso, puerta, código postal" required>
                    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 text-xs text-red-600"></p>
                </div>

                <!-- Teléfono -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-stone-700">Teléfono</label>
                    <input type="tel" id="phone" th:field="*{phone}"
                           class="mt-1 block w-full rounded-md border border-stone-300 px-3 py-2 shadow-sm focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600 text-sm"
                           placeholder="600123456" required>
                    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1 text-xs text-red-600"></p>
                </div>

                <!-- Botón Crear Cuenta -->
                <div class="pt-2">
                    <button type="submit"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-semibold text-white bg-amber-800 hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-600 transition">
                        Crear Cuenta
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-sm text-stone-600">
                <span>¿Ya tiene una cuenta?</span>
                <a th:href="@{/login}" class="font-medium text-amber-800 hover:text-amber-700 underline ml-1">
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-stone-100 border-t border-stone-200 py-4 text-center text-xs text-stone-500">
        © 2026 Sabor del Himalaya - Auténtica Cocina Nepalí a Domicilio
    </footer>

</body>
</html>
