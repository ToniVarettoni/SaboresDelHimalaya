<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Resumen del Pedido - Sabor del Himalaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex flex-col">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    <!-- Encabezado -->
    <div class="flex items-center justify-between border-b border-stone-200 pb-4 mb-8">
        <h1 class="text-3xl font-extrabold text-stone-900">📋 Resumen del Pedido</h1>
        <a href="/carrito"
           class="text-sm font-medium text-amber-800 hover:text-amber-600 transition flex items-center space-x-1">
            <span>←</span><span>Modificar Carrito</span>
        </a>
    </div>
    <!-- Error global -->
    <div th:if="${errorMsg}"
         class="mb-6 bg-red-50 border border-red-300 text-red-700 text-sm px-5 py-3 rounded-xl">
        <span th:text="${errorMsg}"></span>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- IZQUIERDA: Tabla de artículos -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                <div class="bg-amber-900 text-white px-5 py-3">
                    <h2 class="text-sm font-semibold uppercase tracking-wider">Artículos del pedido</h2>
                </div>
                <table class="min-w-full divide-y divide-stone-100">
                    <thead class="bg-stone-50">
                    <tr>
                        <th class="py-2 px-5 text-left text-xs font-semibold text-stone-500 uppercase">Producto</th>
                        <th class="py-2 px-5 text-center text-xs font-semibold text-stone-500 uppercase">Cant.</th>
                        <th class="py-2 px-5 text-center text-xs font-semibold text-stone-500 uppercase">Precio unit.</th>
                        <th class="py-2 px-5 text-right text-xs font-semibold text-stone-500 uppercase">Subtotal</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-stone-100">
                    <tr th:each="item : ${items}" class="hover:bg-amber-50 transition">
                        <td class="py-3 px-5">
                            <div class="flex items-center space-x-2">
                                        <span th:if="${item.type.name() == 'DAILY_MENU'}"
                                              class="bg-amber-100 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Menú</span>
                                <span th:if="${item.type.name() == 'PRODUCT'}" class="bg-stone-100 text-stone-600 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Plato</span>
                                <span class="text-sm font-medium text-stone-900" th:text="${item.name}">Nombre</span>
                            </div>
                        </td>
                        <td class="py-3 px-5 text-center text-sm text-stone-700" th:text="${item.quantity}">1</td>
                        <td class="py-3 px-5 text-center text-sm text-stone-700"
                            th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)} + ' €'">0.00 €</td>
                        <td class="py-3 px-5 text-right text-sm font-bold text-stone-900"
                            th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)} + ' €'">0.00 €</td>
                    </tr>
                    </tbody>
                    <tfoot class="bg-amber-50">
                    <tr>
                        <td colspan="3" class="py-3 px-5 text-right text-sm font-bold text-stone-700 uppercase tracking-wide">
                            Total
                        </td>
                        <td class="py-3 px-5 text-right text-lg font-extrabold text-amber-900"
                            th:text="${#numbers.formatDecimal(total, 1, 2)} + ' €'">0.00 €</td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
        <!-- DERECHA: Formulario de entrega y pago -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden sticky top-6">
                <div class="bg-amber-900 text-white px-5 py-3">
                    <h2 class="text-sm font-semibold uppercase tracking-wider">Datos de entrega y pago</h2>
                </div>
                <form th:action="@{/pedido/confirmar}" method="post"
                      th:object="${orderDto}" class="p-5 space-y-5">
                    <!-- Dirección -->
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wide mb-1">
                            Dirección de entrega *
                        </label>
                        <textarea th:field="*{deliveryAddress}" rows="2"
                                  placeholder="Calle, número, piso..."
                                  class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:ring-amber-500 focus:border-amber-500 resize-none"></textarea>
                        <p th:if="${#fields.hasErrors('deliveryAddress')}"
                           th:errors="*{deliveryAddress}"
                           class="text-red-600 text-xs mt-1"></p>
                    </div>
                    <!-- Teléfono -->
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wide mb-1">
                            Teléfono de contacto *
                        </label>
                        <input type="tel" th:field="*{phone}"
                               placeholder="612 345 678"
                               class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:ring-amber-500 focus:border-amber-500" />
                        <p th:if="${#fields.hasErrors('phone')}"
                           th:errors="*{phone}"
                           class="text-red-600 text-xs mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wide mb-2">
                            Forma de pago *
                        </label>
                        <div class="flex space-x-4">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" th:field="*{paymentMethod}" value="EFECTIVO"
                                       class="text-amber-700 focus:ring-amber-500" />
                                <span class="text-sm font-medium">💵 Efectivo</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" th:field="*{paymentMethod}" value="TARJETA"
                                       class="text-amber-700 focus:ring-amber-500" />
                                <span class="text-sm font-medium">💳 Tarjeta</span>
                            </label>
                        </div>
                        <p th:if="${#fields.hasErrors('paymentMethod')}"
                           th:errors="*{paymentMethod}"
                           class="text-red-600 text-xs mt-1"></p>
                    </div>
                    <!-- Observaciones -->
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wide mb-1">
                            Observaciones <span class="font-normal">(opcional)</span>
                        </label>
                        <textarea th:field="*{notes}" rows="3"
                                  placeholder="Alergias, instrucciones especiales..."
                                  class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:ring-amber-500 focus:border-amber-500 resize-none"></textarea>
                    </div>
                    <!-- Total + botón confirmar -->
                    <div class="border-t border-stone-100 pt-4 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-stone-600 font-medium">Total a pagar:</span>
                            <span class="text-2xl font-extrabold text-amber-900"
                                  th:text="${#numbers.formatDecimal(total, 1, 2)} + ' €'">0.00 €</span>
                        </div>
                        <button type="submit"
                                class="w-full py-3 rounded-xl bg-amber-800 hover:bg-amber-700 text-white font-bold text-sm shadow transition">
                            ✅ Confirmar y realizar pedido
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<footer class="bg-stone-100 border-t border-stone-200 py-6 text-center text-xs text-stone-500 mt-10">
    © 2026 Sabor del Himalaya - Auténtica Cocina Nepalí a Domicilio. Todos los derechos reservados.
</footer>
</body>
</html>
