version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: himalaya_postgres
    restart: always
    environment:
      POSTGRES_DB: himalaya_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servidor SMTP de pruebas para desarrollo local con interfaz web
  mailpit:
    image: axllent/mailpit:latest
    container_name: himalaya_mailpit
    restart: always
    ports:
      - "1025:1025" # Servidor SMTP
      - "8025:8025" # Bandeja de entrada Web (http://localhost:8025)

volumes:
  postgres_data:
